name: Deploy PocketBase

on:
  push:
    branches:
      - claude/create-new-app-URTzX
    paths:
      - 'pocketbase/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render redeploy
        id: deploy
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_PB_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": false}')
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          if [ "$HTTP_CODE" != "201" ]; then
            echo "Deploy trigger failed (HTTP $HTTP_CODE): $BODY"
            exit 1
          fi
          DEPLOY_ID=$(echo "$BODY" | jq -r '.id')
          echo "deploy_id=$DEPLOY_ID" >> $GITHUB_OUTPUT
          echo "Deploy triggered: $DEPLOY_ID"

      - name: Wait for deploy to go live
        run: |
          DEPLOY_ID="${{ steps.deploy.outputs.deploy_id }}"
          for i in $(seq 1 40); do
            STATUS=$(curl -s \
              "https://api.render.com/v1/services/${{ secrets.RENDER_PB_SERVICE_ID }}/deploys/$DEPLOY_ID" \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
              | jq -r '.status')
            echo "Deploy status: $STATUS ($i/40)"
            if [ "$STATUS" = "live" ]; then
              echo "Deploy succeeded"
              exit 0
            fi
            if [ "$STATUS" = "deactivated" ] || [ "$STATUS" = "build_failed" ] || [ "$STATUS" = "update_failed" ]; then
              echo "Deploy failed with status: $STATUS"
              exit 1
            fi
            sleep 15
          done
          echo "Timed out waiting for deploy"
          exit 1
