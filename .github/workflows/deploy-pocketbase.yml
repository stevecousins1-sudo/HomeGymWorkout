name: Deploy PocketBase (backup first)

on:
  push:
    branches:
      - claude/create-new-app-URTzX
    paths:
      - 'pocketbase/**'
  workflow_dispatch:

jobs:
  backup-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate with PocketBase admin API
        id: auth
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST "${{ secrets.PB_URL }}/api/admins/auth-with-password" \
            -H "Content-Type: application/json" \
            -d "{\"identity\":\"${{ secrets.PB_ADMIN_EMAIL }}\",\"password\":\"${{ secrets.PB_ADMIN_PASSWORD }}\"}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Auth failed (HTTP $HTTP_CODE): $BODY"
            exit 1
          fi
          TOKEN=$(echo "$BODY" | jq -r '.token')
          echo "token=$TOKEN" >> $GITHUB_OUTPUT
          echo "Auth successful"

      - name: Create backup via PocketBase API
        id: backup
        run: |
          BACKUP_NAME="pre-deploy-$(date -u +%Y%m%d-%H%M%S).zip"
          echo "name=$BACKUP_NAME" >> $GITHUB_OUTPUT
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.PB_URL }}/api/backups" \
            -H "Authorization: ${{ steps.auth.outputs.token }}" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"$BACKUP_NAME\"}")
          if [ "$HTTP_CODE" != "204" ]; then
            echo "Backup creation failed (HTTP $HTTP_CODE)"
            exit 1
          fi
          echo "Backup triggered: $BACKUP_NAME"

      - name: Wait for backup to appear
        run: |
          BACKUP_NAME="${{ steps.backup.outputs.name }}"
          for i in $(seq 1 24); do
            FOUND=$(curl -s \
              -H "Authorization: ${{ steps.auth.outputs.token }}" \
              "${{ secrets.PB_URL }}/api/backups" \
              | jq --arg name "$BACKUP_NAME" 'any(.[]; .key == $name)')
            if [ "$FOUND" = "true" ]; then
              echo "Backup confirmed: $BACKUP_NAME"
              exit 0
            fi
            echo "Waiting... ($i/24)"
            sleep 5
          done
          echo "Timed out waiting for backup"
          exit 1

      - name: Download backup from PocketBase
        run: |
          BACKUP_NAME="${{ steps.backup.outputs.name }}"
          TOKEN="${{ steps.auth.outputs.token }}"
          HTTP_CODE=$(curl -s -L -o /tmp/$BACKUP_NAME -w "%{http_code}" \
            "${{ secrets.PB_URL }}/api/backups/$BACKUP_NAME?token=$TOKEN")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Download failed (HTTP $HTTP_CODE)"
            exit 1
          fi
          SIZE=$(wc -c < /tmp/$BACKUP_NAME)
          echo "Downloaded $BACKUP_NAME ($SIZE bytes)"

      - name: Upload backup to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          BACKUP_NAME="${{ steps.backup.outputs.name }}"
          ENDPOINT="https://${{ secrets.CF_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          aws s3 cp /tmp/$BACKUP_NAME "s3://${{ secrets.CF_R2_BUCKET }}/$BACKUP_NAME" \
            --endpoint-url "$ENDPOINT"
          echo "Uploaded $BACKUP_NAME to R2"

      - name: Trigger Render redeploy
        id: deploy
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_PB_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": false}')
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)
          if [ "$HTTP_CODE" != "201" ]; then
            echo "Deploy trigger failed (HTTP $HTTP_CODE): $BODY"
            exit 1
          fi
          DEPLOY_ID=$(echo "$BODY" | jq -r '.id')
          echo "deploy_id=$DEPLOY_ID" >> $GITHUB_OUTPUT
          echo "Deploy triggered: $DEPLOY_ID"

      - name: Wait for deploy to go live
        run: |
          DEPLOY_ID="${{ steps.deploy.outputs.deploy_id }}"
          for i in $(seq 1 40); do
            STATUS=$(curl -s \
              "https://api.render.com/v1/services/${{ secrets.RENDER_PB_SERVICE_ID }}/deploys/$DEPLOY_ID" \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
              | jq -r '.status')
            echo "Deploy status: $STATUS ($i/40)"
            if [ "$STATUS" = "live" ]; then
              echo "Deploy succeeded"
              exit 0
            fi
            if [ "$STATUS" = "deactivated" ] || [ "$STATUS" = "build_failed" ] || [ "$STATUS" = "update_failed" ]; then
              echo "Deploy failed with status: $STATUS"
              exit 1
            fi
            sleep 15
          done
          echo "Timed out waiting for deploy"
          exit 1
