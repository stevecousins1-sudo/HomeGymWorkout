services:
  - type: web
    name: homegymworkout
    env: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_PB_URL
        value: https://homegymworkout-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: homegymworkout-api
    env: docker
    dockerfilePath: ./pocketbase/Dockerfile
    dockerContext: ./pocketbase
    disk:
      name: pb-data
      mountPath: /pb/pb_data
      sizeGB: 1
