services:
  - type: web
    name: homegymworkout
    env: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://homegymworkout-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: homegymworkout-api
    env: node
    rootDir: api
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: homegymworkout-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: homegymworkout-db
    plan: starter
